# Builds every plugin (native parts included) on work branches, so a plugin that doesn't
# compile is caught before it reaches main and blocks releases. Publishes nothing.

name: Build check

on:
  push:
    branches-ignore: [main, gh-pages]
    paths:
      - 'plugins/**'
      - 'private/**'
      - '*.gradle.kts'
      - 'gradle/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: bun install
      - name: Build and package all plugins
        env:
          GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN }}
        run: ./gradlew --no-daemon packageAllPlugins

      # The plugins in private/ are never published. Their packaged files are kept here as a
      # build artifact instead, to install by hand.
      - name: Collect the private plugins
        run: |
          mkdir -p build/private
          for manifest in private/*/manifest.json; do
            id=$(jq -r .id "$manifest")
            version=$(jq -r .version "$manifest")
            cp "build/dist/${id}@${version}.zip" build/private/ 2>/dev/null || echo "::warning::no package for ${id}@${version}"
          done
          ls -l build/private
      - uses: actions/upload-artifact@v4
        with:
          name: private-plugins
          path: build/private/*.zip

# Builds the Media Controls plugin (with its native Kotlin part) and the Media Bridge companion app.
# Runs on pushes that touch them, and by hand. The plugin isn't released from here: release.yml
# publishes it once it's on main.

name: Media Controls build

on:
  push:
    paths:
      - 'companion/**'
      - 'plugins/media-controls/**'
      - '.github/workflows/media-controls.yml'
  workflow_dispatch:

jobs:
  bridge:
    name: Media Bridge app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.MEDIA_BRIDGE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/media-bridge.jks"
            echo "MEDIA_BRIDGE_KEYSTORE=$RUNNER_TEMP/media-bridge.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No MEDIA_BRIDGE_KEYSTORE_BASE64 secret: the APK is signed with a throwaway debug key, so updating it needs an uninstall first."
          fi

      - name: Build APK
        working-directory: companion
        env:
          MEDIA_BRIDGE_KEYSTORE_PASSWORD: ${{ secrets.MEDIA_BRIDGE_KEYSTORE_PASSWORD }}
          MEDIA_BRIDGE_KEY_ALIAS: ${{ secrets.MEDIA_BRIDGE_KEY_ALIAS }}
          MEDIA_BRIDGE_KEY_PASSWORD: ${{ secrets.MEDIA_BRIDGE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../build/bridge
          cp build/outputs/apk/release/*.apk ../build/bridge/MediaBridge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MediaBridge-apk
          path: build/bridge/MediaBridge.apk

  plugin:
    name: Media Controls plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check for the GitHub Packages token
        env:
          TOKEN: ${{ secrets.READ_PACKAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add a READ_PACKAGES_TOKEN repository secret (a GitHub token with read:packages). The native part compiles against the Valenced API, which GitHub Packages only serves with a token."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build and package the plugin
        env:
          GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN }}
        run: ./gradlew --no-daemon packageMediaControls

      - uses: actions/upload-artifact@v4
        with:
          name: media-controls-plugin
          path: build/dist/*.zip

  # A test release with both files, for installing on a phone before the plugin goes to main.
  test-release:
    name: Publish test build
    needs: [bridge, plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Replace the media-controls-test pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          ls -R out
          gh release delete media-controls-test --yes --cleanup-tag || true
          gh release create media-controls-test \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Media Controls (test build)" \
            --notes "Test build of the Media Controls plugin and the Media Bridge app from ${GITHUB_SHA::7}. Install MediaBridge.apk, open it and turn on notification access, then install the plugin ZIP in Valenced (Plugins > settings gear > Install from file)." \
            out/MediaBridge-apk/MediaBridge.apk \
            out/media-controls-plugin/*.zip
